[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-notice-assistant"
version = "0.7.4"
description = "课程通知助理：本地任务管理与 AI 自然语言解析"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit==1.55.0"]
desktop = ["streamlit==1.55.0", "pywebview==6.2.1", "pythonnet==3.2.1; sys_platform == 'win32'"]

[project.scripts]
course-assistant = "course_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["course_assistant*"]
